name: AI Builder CI Quality Gate

on:
  workflow_dispatch: # Allows manual trigger from Actions tab
  push:
    branches:
      - main
      - develop
      - 'refactor/**'
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Test Suite (FastAPI + Pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend_fastapi

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv Package Manager
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "backend_fastapi/requirements.txt"

      - name: Install Backend Dependencies
        run: |
          uv sync || pip install -r requirements.txt

      - name: Run Pytest Test Suite (24 Tests)
        run: |
          uv run pytest -v --tb=short || pytest -v --tb=short
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          JWT_SECRET_KEY: "ci-testing-secret-key-super-secure"

  frontend-quality:
    name: Frontend Quality Gate (TypeScript + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Verify TypeScript Types (tsc -b)
        run: npx tsc -b

      - name: Verify Production Vite Build
        run: npm run build
        env:
          VITE_BACKEND_URL: ""

