version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend_node
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend_node/workflows.db:/app/workflows.db
      - ./backend_node/workflow_app.db:/app/workflow_app.db
