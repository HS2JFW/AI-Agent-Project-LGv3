version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aibuilder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aibuilder_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-aibuilder_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aibuilder} -d ${POSTGRES_DB:-aibuilder_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend_fastapi
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8001"
    environment:
      - PORT=8001
      - HOST=0.0.0.0
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:////app/data/workflows.db}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-ai-agent-project-lgv3-jwt-secret-key-super-secure-2026}
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
    volumes:
      - backend_data:/app/data
      - backend_outputs:/app/agent_outputs
      - backend_logs:/app/logs
      - backend_inputs:/app/workflow_inputs

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_BACKEND_URL=
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_data:
  backend_outputs:
  backend_logs:
  backend_inputs:
