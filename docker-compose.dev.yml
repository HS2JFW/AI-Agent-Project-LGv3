version: '3.8'

services:
  backend:
    build:
      context: ./backend_fastapi
      dockerfile: Dockerfile
    container_name: ai-builder-dev-backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - HOST=0.0.0.0
      - DATABASE_URL=sqlite+aiosqlite:////app/data/workflows.db
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-ai-agent-project-lgv3-jwt-secret-key-super-secure-2026}
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
    volumes:
      - ./backend_fastapi:/app
      - backend_dev_data:/app/data
      - backend_dev_outputs:/app/agent_outputs
      - backend_dev_logs:/app/logs
      - backend_dev_inputs:/app/workflow_inputs

  frontend:
    image: node:20-alpine
    container_name: ai-builder-dev-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_BACKEND_URL=http://localhost:8001
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  backend_dev_data:
  backend_dev_outputs:
  backend_dev_logs:
  backend_dev_inputs:
